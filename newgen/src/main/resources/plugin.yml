name: EXMenu
main: cn.listudio.exmenu.MenuPlugin
version: ${project.version}
author: handy
api-version: '1.13'
description: YAML 驱动的菜单插件（Spigot + Folia）
website: https://ricedoc.handyplus.cn/wiki/PlayerMenu/
folia-supported: true
softdepend:
  - PlaceholderAPI
  - Vault
commands:
  exmenu:
    description: EXMenu 菜单插件
    usage: /exmenu <子命令>
permissions:
  exmenu.*:
    description: EXMenu 菜单插件的全部权限
    default: op
    children:
      exmenu.open: true
      exmenu.close: true
      exmenu.clock: true
      exmenu.reload: true
      exmenu.create: true
      exmenu.view: true
      exmenu.item: true
      exmenu.addItem: true
      exmenu.getItem: true
      exmenu.getMaterial: true
      exmenu.clear: true
      exmenu.convert: true
      exmenu.adminOpen: true
      exmenu.check: true
  exmenu.open:
    description: 打开菜单
    default: true
  exmenu.close:
    description: 关闭菜单
    default: true
  exmenu.clock:
    description: 取回菜单时钟
    default: true
  exmenu.reload:
    description: 重载配置
    default: op
  exmenu.create:
    description: 创建菜单
    default: op
  exmenu.view:
    description: 预览菜单
    default: op
  exmenu.item:
    description: 存入物品库
    default: op
  exmenu.addItem:
    description: 设置按钮图标
    default: op
  exmenu.getItem:
    description: 取出物品库物品
    default: op
  exmenu.getMaterial:
    description: 获取材质名
    default: op
  exmenu.clear:
    description: 清理限制数据
    default: op
  exmenu.convert:
    description: 数据迁移
    default: op
  exmenu.adminOpen:
    description: 管理员打开菜单
    default: op
  exmenu.check:
    description: 校验菜单配置
    default: op
